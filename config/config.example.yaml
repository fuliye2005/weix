# Weix 配置文件模板
# 复制为 config.yaml 后按需修改
# 敏感值请使用环境变量: ${VAR_NAME} 或 ${VAR_NAME:-默认值}

admin:
  jwt_secret: ${JWT_SECRET:-change-me-in-production}
  password: ${ADMIN_PASSWORD:-admin123}
  username: admin

ai:
  amap_key: ${AMAP_KEY:-}
  amap_security_key: ${AMAP_SECURITY_KEY:-}
  api_key: ${DEEPSEEK_API_KEY:-}
  base_url: https://api.deepseek.com
  max_tokens: 2000
  model: deepseek-v4-pro
  persona_message_limit: 3000
  persona_import_max_mb: 256
  persona_mode: persona
  persona_replay:
    direct_threshold: 0.82
    few_shot_threshold: 0.55
    context_messages: 3
    few_shot_count: 3
    repeat_cooldown: 20
  persona_since_days: 90
  provider: deepseek
  system_prompt: 通用能力要求：根据上下文自然进行中文微信对话；若 Persona 已加载，身份以目标人物 Persona 为准，不要自称聊天助手；先像真人聊天再回答，不要总结人物画像。
  temperature: 0.7

anti_detect:
  circuit_breaker_threshold: 3
  cooldown_per_session: 30
  macos:
    max_send_interval: 20
    min_send_interval: 8
  max_messages_per_minute: 20
  max_send_interval: 45
  min_send_interval: 15

auto_reply:
  enabled: true
  group_chat_mode: whitelist
  group_whitelist: []
  private_chat_mode: whitelist
  private_whitelist: []
  reply_mode: all
  rules: []

database:
  url: sqlite+aiosqlite:///data/weix.db

forward_rules: []

macos_sender:
  click_x_ratio: 0.5
  click_y_ratio: 0.95
  group_search_arrows: 2
  method: applescript
  search_result_delay: 5.0
  type_delay: 0.3
  window_activate_delay: 0.5

windows_sender:
  method: uia
  # 先尝试后台 UIA；目标不在可见会话或后台 Pattern 不完整时，自动使用前台 UIA
  send_mode: auto
  background_mode: false
  allow_foreground_activation: true
  # 窄窗口时通过 Win32 ShowWindow 恢复完整导航布局，不执行鼠标或坐标点击
  ensure_full_layout: true
  allow_mouse_fallback: false
  # 只有显式设置 enter/ctrl_enter 才允许按键兜底，默认只调用真实发送按钮 Pattern
  send_key_fallback: none
  # UIA 找到发送按钮后可投递窗口消息，不移动真实鼠标、不抢键盘
  background_post_message: true
  require_ui_verify: true
  input_verify_timeout: 3.0
  ui_verify_timeout: 4.0
  click_x_ratio: 0.5
  click_y_ratio: 0.88
  park_after_send: false
  parking_receiver: 小号
  paste_method: context_menu
  search_x_offset: 173
  search_y_offset: 49
  search_clear_x_offset: 247
  search_clear_y_offset: 49
  search_result_x_offset: 153
  search_result_y_offset: 130
  send_button_x_from_right: 72
  send_button_y_from_bottom: 40
  verify_after_send: true
  verify_timeout: 30.0
  verify_interval: 1.0
  # UIA 已执行发送但微信数据库稍后才落盘时，后台只查库确认，不会再次发送
  pending_verify_retries: 2
  search_result_delay: 2.0
  skip_search_ttl: 60
  type_delay: 0.3
  window_activate_delay: 0.5

monitor:
  poll_interval: 2

platform: auto

statistics:
  daily_report_time: "22:00"
  data_retention_days: 30
  weekly_report_day: 6
  weekly_report_time: "20:00"

templates: []

wcf:
  enabled: true
  host: 127.0.0.1
  port: 10010

wechat:
  macos:
    data_dir: auto
    version: 4.x
  windows:
    data_dir: auto
    version: 3.9.12.51

workflow_engine: legacy
workflows: []
